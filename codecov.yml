# Codecov reports the WaypointCore coverage that the Linux stage measures (the "coverage"
# artifact, coverage.lcov), uploaded by the checks workflow's "Coverage to Codecov" job.
# - Statuses only, no pull request comment or line annotations: the AI reviews (CodeRabbit,
#   and Gitar on trial) are the only comments on a PR.
# - Coverage never drops: the project status fails on any drop from the base commit, and the
#   patch status asks every changed line that the upload covers to be covered. The base isn't
#   adjusted for removed lines, so any drop fails.
# - Neither status is a required check; they show the numbers next to the tests.
comment: false
github_checks:
  annotations: false
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0%
        removed_code_behavior: off
    patch:
      default:
        target: 100%

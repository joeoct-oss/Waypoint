name: Bug
description: Something does not work as designed.
labels: ["type:fix"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping Waypoint. Maintainers plan the work privately; when work starts on this issue, it is linked back here. Fill in what you know: fields about plans and checkpoints are for maintainers, and they add the labels.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What the fix delivers, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you saw, and what you expected instead. Include the device, iOS and Xcode versions.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the example app branch and flow if it shows there.
    validations:
      required: true
  - type: input
    id: plan
    attributes:
      label: Plan
      description: Link to the plan, if there is one. Maintainers add it when work starts.
    validations:
      required: false
  - type: dropdown
    id: checkpoint
    attributes:
      label: Checkpoint
      options:
        - C2 Core and SwiftUI stack
        - C3 Presentation, tabs and child flows
        - C4 UIKit, mixed flows and links
        - C5 Events, testing and real app
        - C6 0.x in a real app
        - Later (1.0 and 1.1)
        - Not set yet (maintainers schedule it)
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What this issue changes, as a bullet list.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What it leaves to other issues, each as a readable link. Write None if nothing.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Tests
      description: A table of behaviour, test name and where it runs (Linux (cloud), Mac or GitHub's macOS runners). Tests check what the app sees, never internals. Write "None, because ..." if no behaviour changes.
      value: |
        | Behaviour | Test | Runs on |
        |---|---|---|
        |  |  |  |
    validations:
      required: true
  - type: textarea
    id: required
    attributes:
      label: Required before done
      description: Every box must be ticked before the issue closes. Keep the five standard items and add this issue's own below them.
      value: |
        - [ ] Tests written first, seen failing, now passing
        - [ ] Plan status set to Done, status log updated
        - [ ] Docs in sync (articles, README, CODE_STYLE where touched)
        - [ ] PR merged (squash, or a merge commit when its history explains why), PR body free of attribution
        - [ ] Board item moved to Done
    validations:
      required: true
  - type: textarea
    id: optional
    attributes:
      label: Optional
      description: Steps that don't block closing. When the issue closes, each is ticked or moved to a follow-up issue with "→ link". Write None if nothing.
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: Links
      description: A bullet list, one per line, each a readable link such as "[Flow results between coordinators](url)". Never a bare #n or a raw URL. Write None if nothing.
    validations:
      required: true

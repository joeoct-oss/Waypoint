# Tests the package and the example app with Apple's toolchain, on GitHub's standard macOS
# runners, which are free for a public repo: every test layer the Mac's `full` tier ran
# (TESTING.md, "On pull requests (CI)"). The builds come first and apart, in the checks
# workflow's "Apple build" job, so a change that doesn't compile spends no test time.
# - It starts once a pull request's code checks passed (SonarQube, the Linux gate and the Apple
#   build) and its head commit is approved (by CodeRabbit or a person) or carries the
#   run-apple-checks label, whichever comes last (scripts/apple-tests-ready.sh). The checks
#   workflow calls it when those checks pass, and apple-tests.yml when the approval or the label
#   arrives. Drafts are skipped. A docs-only pull request (docs-only input) skips every job, and
#   the gate reports a pass.
# - Every caller names its job "Apple platform checks", so the gate always reports as
#   "Apple platform checks / Apple builds and tests". A newer run for the same commit cancels
#   this one, and a push cancels the runs of the commits before it.
# - Built products: waits for the "Apple build" check on the head commit and finds the run that
#   holds its test products. When they can't be fetched (an expired artifact), the rebuild job
#   builds them again in this run.
# - Package tests: the host tests and the compile fixtures with warnings as errors, the unified
#   log tests under the thread sanitizer, and the package tests on an iPhone simulator.
# - UI tests, shard 1 to 3: a third of the UI test classes each (scripts/ui-test-shards.py), on one
#   simulator, from the built products. A failed test runs once more, and
#   scripts/judge-test-results.sh decides with Example/quarantine.json: a pass on the retry is
#   flaky and doesn't block, a test that failed both tries blocks unless it is quarantined.
# - Example app unit tests, once the package tests ended, from the built products.
# - Release reports: the system link and missing destination UI tests again with the app built
#   in Release, once the unit tests ended, so a run never holds more than 4 macOS jobs at once.
# Hardening: standard GitHub-hosted runners only, never a larger runner (those are billed) and no
# self-hosted Mac. Every action is pinned to a full commit SHA with the version in a comment, each
# job reads the repo and nothing else, and no checkout keeps the token. The runner label and the
# Xcode version are pinned and bumped by hand, so a changed image fails loudly. Tuist is the one
# .mise.toml pins, checked against its checksum (scripts/install-tuist.sh). It signs in with
# GitHub's identity token (`id-token: write`, only the jobs that generate the project), since the
# project names its Tuist account, but takes no binary cache and no Xcode compilation cache, so
# nothing a cache holds reaches a run.
name: Apple platform checks

on:
  workflow_call:
    inputs:
      docs-only:
        description: The change touches only docs no build reads, so every job is skipped
        type: boolean
        default: false

permissions: {}

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
  SIMULATOR: iPhone 17
  SIMULATOR_OS: "27.2"
  # Turns off the scheme's Tuist build and test insights post-actions: the runners aren't signed
  # in to Tuist.
  WAYPOINT_TUIST_OFFLINE: "1"
  TUIST_DISABLE_ANALYTICS: "1"
  # The test products the "Apple build" job builds and the test jobs run.
  PRODUCTS: .build/WaypointExample.xctestproducts

jobs:
  products:
    name: Built products
    if: ${{ !github.event.pull_request.draft && !inputs.docs-only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      actions: read
      checks: read
    outputs:
      run-id: ${{ steps.find.outputs.run-id }}
    steps:
      # A push cancels the Apple tests of the commit before it, except where the token can't cancel
      # runs (fork and Dependabot pull requests); this stops such a run before any macOS job.
      - name: Is this still the pull request's head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          current=$(gh api "repos/$REPO/commits/refs/pull/$NUMBER/head" --jq '.sha')
          if [[ "$current" != "$HEAD_SHA" ]]; then
            echo "::error::$HEAD_SHA is no longer the pull request's head ($current is), so its tests are pointless."
            exit 1
          fi

      # The build starts beside the Linux checks, so it has usually ended by now; this waits for
      # it when it hasn't, and fails when it failed, since there is nothing to test. The products
      # are named after the merge commit they were built from, so they are used only when this run
      # tests the same one.
      - name: Wait for the Apple build and find its products
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PRODUCTS_NAME: example-test-products-${{ github.sha }}
        run: |
          status=""
          conclusion=""
          suite=""
          for _ in $(seq 1 130); do
            build=$(gh api -X GET "repos/$REPO/commits/$HEAD_SHA/check-runs" \
              -f check_name="Apple build" -f filter=latest \
              --jq '.check_runs[0] // {} | [.status // "", .conclusion // "", .check_suite.id // ""] | @tsv')
            IFS=$'\t' read -r status conclusion suite <<<"$build"
            if [[ "$status" == "completed" ]]; then
              break
            fi
            echo "The Apple build on $HEAD_SHA is ${status:-not started}; checking again in 30 s."
            sleep 30
          done
          if [[ "$status" != "completed" || "$conclusion" != "success" ]]; then
            echo "::error::The Apple build on $HEAD_SHA didn't pass (${conclusion:-${status:-not started}}), so there is nothing to test."
            exit 1
          fi
          run=$(gh api -X GET "repos/$REPO/actions/runs" -f check_suite_id="$suite" \
            --jq '.workflow_runs[0].id')
          if gh api "repos/$REPO/actions/runs/$run/artifacts" \
            --jq ".artifacts[] | select(.name == \"$PRODUCTS_NAME\" and (.expired | not)) | .id" |
            grep -q .; then
            echo "The test products are in run $run."
            echo "run-id=$run" >> "$GITHUB_OUTPUT"
          else
            echo "Run $run has no $PRODUCTS_NAME (they expired, or main moved since that build), so this run builds them again."
            echo "run-id=" >> "$GITHUB_OUTPUT"
          fi

  rebuild:
    name: Build the test products again (Xcode 27.2)
    needs: products
    if: ${{ needs.products.outputs.run-id == '' }}
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tuist
        run: scripts/install-tuist.sh "$RUNNER_TEMP/tuist"

      - name: Build the app and its tests
        run: scripts/build-example-tests.sh "$SIMULATOR" "$SIMULATOR_OS"

      - name: Hand the built tests to the test jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-test-products-${{ github.sha }}
          path: .build/example-test-products.tar
          retention-days: 30
          if-no-files-found: error

  package:
    name: Package tests (Xcode 27.2)
    needs: products
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show the tools
        run: |
          xcodebuild -version
          swift --version
          sysctl -n hw.ncpu hw.memsize machdep.cpu.brand_string
          xcrun simctl list runtimes available

      - name: Check the compile fixtures
        run: WAYPOINT_SWIFT_BUILD_FLAGS="--force-resolved-versions -Xswiftc -warnings-as-errors" scripts/check-compile-failures.sh

      - name: Test on the macOS host, with warnings as errors
        run: swift test --force-resolved-versions -Xswiftc -warnings-as-errors

      - name: Test the unified log under the thread sanitizer
        run: |
          swift test --force-resolved-versions --sanitize=thread --scratch-path .build/thread-sanitizer \
            --filter WaypointOSLogTests

      - name: Test on the iPhone simulator, with warnings as errors in Waypoint's own code
        run: |
          udid=$(scripts/find-ci-simulator.sh "$SIMULATOR" "$SIMULATOR_OS")
          scripts/own-warnings-as-errors.sh scripts/package-xcodebuild.sh test -quiet \
            -scheme Waypoint-Package \
            -destination "id=$udid" \
            -parallel-testing-enabled NO \
            -resultBundlePath .build/results/package.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Keep the result bundle of a failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-results
          path: .build/results
          retention-days: 7
          if-no-files-found: ignore

  ui:
    name: UI tests, shard ${{ matrix.shard }} of 3 (Xcode 27.2)
    needs: [products, rebuild]
    if: ${{ !cancelled() && needs.products.result == 'success' && needs.rebuild.result != 'failure' }}
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # From the checks run's "Apple build", or from this run when the rebuild job built them.
      - name: Fetch the built tests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: example-test-products-${{ github.sha }}
          path: .build
          run-id: ${{ needs.products.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Unpack the built tests
        run: tar -C .build -xf .build/example-test-products.tar

      - name: Run this shard's UI tests
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          scripts/ui-test-shards.py 3 --list
          # Read first, so a failing selector stops the step instead of leaving the shard empty.
          selection=$(scripts/ui-test-shards.py 3 "$SHARD")
          only=()
          while IFS= read -r argument; do
            if [[ -n "$argument" ]]; then
              only+=("$argument")
            fi
          done <<<"$selection"
          if [[ ${#only[@]} -eq 0 ]]; then
            echo "This shard has no UI test class."
            exit 0
          fi
          udid=$(scripts/find-ci-simulator.sh "$SIMULATOR" "$SIMULATOR_OS")
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          bundle=.build/results/ui-shard-$SHARD.xcresult
          status=0
          xcodebuild test-without-building -quiet \
            -testProductsPath "$PRODUCTS" \
            -destination "id=$udid" \
            "${only[@]}" \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure -test-iterations 2 \
            -resultBundlePath "$bundle" || status=$?
          scripts/judge-test-results.sh "$status" "$bundle"

      - name: Keep the result bundle of a failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-shard-${{ matrix.shard }}-results
          path: .build/results
          retention-days: 7

  # After the package tests, so the run holds at most 4 macOS jobs: the package tests, this job
  # or the release reports, beside the 3 shards.
  example:
    name: Example app unit tests (Xcode 27.2)
    needs: [products, rebuild, package]
    if: ${{ !cancelled() && needs.products.result == 'success' && needs.rebuild.result != 'failure' }}
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the built tests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: example-test-products-${{ github.sha }}
          path: .build
          run-id: ${{ needs.products.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Unpack the built tests
        run: tar -C .build -xf .build/example-test-products.tar

      # Every test bundle but the UI tests: the app's own unit tests and each module's.
      - name: Run the example app's unit tests
        run: |
          udid=$(scripts/find-ci-simulator.sh "$SIMULATOR" "$SIMULATOR_OS")
          bundle=.build/results/example-unit.xcresult
          status=0
          xcodebuild test-without-building -quiet \
            -testProductsPath "$PRODUCTS" \
            -destination "id=$udid" \
            -skip-testing:WaypointExampleUITests \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure -test-iterations 2 \
            -resultBundlePath "$bundle" || status=$?
          scripts/judge-test-results.sh "$status" "$bundle"

      - name: Keep the result bundle of a failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-unit-results
          path: .build/results
          retention-days: 7

  # A system link and a route with no destination in its stack must be reported in release builds
  # too, so their UI tests run again with the app and the tests built in Release.
  release-reports:
    name: Release reports (Xcode 27.2)
    needs: [products, example]
    if: ${{ !cancelled() && needs.products.result == 'success' }}
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tuist
        run: scripts/install-tuist.sh "$RUNNER_TEMP/tuist"

      - name: Generate the example app
        run: |
          tuist install --path Example
          tuist generate --path Example --no-open

      - name: Build in Release and run the release report UI tests
        run: |
          udid=$(scripts/find-ci-simulator.sh "$SIMULATOR" "$SIMULATOR_OS")
          bundle=.build/results/release-reports.xcresult
          status=0
          xcodebuild test -quiet \
            -workspace Example/WaypointExample.xcworkspace \
            -scheme WaypointExample \
            -configuration Release \
            -destination "id=$udid" \
            -derivedDataPath .build/release-reports-derived-data \
            -only-testing:WaypointExampleUITests/SystemLinkTests \
            -only-testing:WaypointExampleUITests/MissingDestinationTests \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure -test-iterations 2 \
            -resultBundlePath "$bundle" \
            -skipMacroValidation \
            COMPILATION_CACHE_ENABLE_CACHING=NO \
            WAYPOINT_TUIST_OFFLINE=1 WAYPOINT_TUIST_TEST_RUN=1 || status=$?
          scripts/judge-test-results.sh "$status" "$bundle"

      - name: Keep the result bundle of a failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-reports-results
          path: .build/results
          retention-days: 7

  # Skipped, not failed, when a newer run cancels this one, since that run replaces it. The
  # rebuild job is skipped when the products came from the checks run.
  gate:
    name: Apple builds and tests
    needs: [products, rebuild, package, ui, example, release-reports]
    if: ${{ !cancelled() && !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      # A docs-only change skips every job on purpose, so it passes.
      - name: Check that every job passed
        env:
          DOCS_ONLY: ${{ inputs.docs-only }}
          REBUILD: ${{ needs.rebuild.result }}
          RESULTS: >-
            ${{ needs.products.result }} ${{ needs.package.result }} ${{ needs.ui.result }}
            ${{ needs.example.result }} ${{ needs.release-reports.result }}
        run: |
          if [[ "$DOCS_ONLY" == "true" ]]; then
            echo "Docs-only change: no build reads these files, so the checks were skipped."
            exit 0
          fi
          echo "Job results: $RESULTS, rebuild: $REBUILD"
          if [[ "$REBUILD" != "success" && "$REBUILD" != "skipped" ]]; then
            echo "::error::The test products couldn't be built again ($REBUILD)."
            exit 1
          fi
          for result in $RESULTS; do
            if [[ "$result" != "success" ]]; then
              echo "::error::An Apple check didn't pass: $RESULTS."
              exit 1
            fi
          done

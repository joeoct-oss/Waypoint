# Builds and tests the package and the example app with Apple's toolchain, on GitHub's standard
# macOS runners, which are free for a public repo: every layer the Mac's `full` tier ran
# (TESTING.md, "On pull requests (CI)").
# - The checks workflow (checks.yml) calls it on pull requests to main once the Linux checks
#   passed, so no macOS time goes to a change that already fails on Linux; drafts are skipped until
#   they are ready for review. A docs-only pull request (docs-only input) skips every job, and the
#   gate reports a pass.
# - "Apple builds and tests" is its one gate: it passes only when every job below passed.
# - Package on Apple: the host build and tests with warnings as errors and the compile fixtures,
#   the unified log tests under the thread sanitizer, the package tests on an iPhone simulator,
#   the build for an iOS device (the iOS 17 floor) and the docs build.
# - Example app: generates the project with Tuist, builds the app and every test bundle once for
#   the simulator, runs the example app's unit tests, checks Tuist's test hashes, and hands the
#   built tests to the UI test shards.
# - UI tests, shard 1 to 3: a third of the UI test classes each (scripts/ui-test-shards.py), on one
#   simulator, from the example job's build. A failed test runs once more, and
#   scripts/judge-test-results.sh decides with Example/quarantine.json: a pass on the retry is
#   flaky and doesn't block, a test that failed both tries blocks unless it is quarantined.
# - Release reports: the system link and missing destination UI tests again with the app built
#   in Release, once the package job ended, so a run never holds more than 4 macOS jobs at once.
# Hardening: standard GitHub-hosted runners only, never a larger runner (those are billed) and no
# self-hosted Mac. Every action is pinned to a full commit SHA with the version in a comment, each
# job reads the repo and nothing else, and no checkout keeps the token. The runner label and the
# Xcode version are pinned and bumped by hand, so a changed image fails loudly. Tuist is the one
# .mise.toml pins, checked against its checksum (scripts/install-tuist.sh). It signs in with
# GitHub's identity token (`id-token: write`, the two jobs that generate the project), since the
# project names its Tuist account, but takes no binary cache and no Xcode compilation cache, so
# nothing a cache holds reaches a run.
name: Apple platform checks

on:
  workflow_call:
    inputs:
      docs-only:
        description: The change touches only docs no build reads, so every job is skipped
        type: boolean
        default: false
  workflow_dispatch:

permissions: {}

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
  SIMULATOR: iPhone 17
  SIMULATOR_OS: "27.2"
  # Turns off the scheme's Tuist build and test insights post-actions: the runners aren't signed
  # in to Tuist.
  WAYPOINT_TUIST_OFFLINE: "1"
  TUIST_DISABLE_ANALYTICS: "1"
  # The test products the example job builds and the shards run.
  PRODUCTS: .build/WaypointExample.xctestproducts

jobs:
  package:
    name: Package on Apple (Xcode 27.2)
    if: ${{ !github.event.pull_request.draft && !inputs.docs-only }}
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show the tools
        run: |
          xcodebuild -version
          swift --version
          sysctl -n hw.ncpu hw.memsize machdep.cpu.brand_string
          xcrun simctl list runtimes available

      # One build with warnings as errors serves the fixtures and the tests.
      - name: Build the tests on the macOS host, with warnings as errors
        run: swift build --build-tests -Xswiftc -warnings-as-errors

      - name: Check the compile fixtures
        run: WAYPOINT_SWIFT_BUILD_FLAGS="-Xswiftc -warnings-as-errors" scripts/check-compile-failures.sh

      - name: Test on the macOS host, with warnings as errors
        run: swift test -Xswiftc -warnings-as-errors

      - name: Test the unified log under the thread sanitizer
        run: |
          swift test --sanitize=thread --scratch-path .build/thread-sanitizer \
            --filter WaypointOSLogTests

      - name: Test on the iPhone simulator, with warnings as errors in Waypoint's own code
        run: |
          udid=$(scripts/find-ci-simulator.sh "$SIMULATOR" "$SIMULATOR_OS")
          scripts/own-warnings-as-errors.sh scripts/package-xcodebuild.sh test -quiet \
            -scheme Waypoint-Package \
            -destination "id=$udid" \
            -parallel-testing-enabled NO \
            -resultBundlePath .build/results/package.xcresult \
            CODE_SIGNING_ALLOWED=NO

      # The deployment target is the iOS 17 floor, so an API newer than the floor fails here.
      # Build only: the runners have no iOS 17 simulator.
      - name: Build for an iOS device, with warnings as errors in Waypoint's own code
        run: |
          scripts/own-warnings-as-errors.sh scripts/package-xcodebuild.sh build -quiet \
            -scheme Waypoint-Package \
            -destination generic/platform=iOS \
            CODE_SIGNING_ALLOWED=NO

      # Build only: the docs site is deployed from the Mac.
      - name: Build the docs
        run: scripts/build-docs.sh

  example:
    name: Example app build and unit tests (Xcode 27.2)
    if: ${{ !github.event.pull_request.draft && !inputs.docs-only }}
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
      # Tuist signs in to the project's Tuist account with GitHub's identity token, which the
      # generated project's settings need; no Tuist secret sits in the repo.
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tuist
        run: scripts/install-tuist.sh "$RUNNER_TEMP/tuist"

      - name: Generate the example app
        run: |
          tuist install --path Example
          tuist generate --path Example --no-open

      # Every test bundle the scheme runs, built once for the simulator. The Xcode compilation
      # cache is off: its local proxy only runs on a Mac set up for it.
      - name: Build the app and its tests
        run: |
          udid=$(scripts/find-ci-simulator.sh "$SIMULATOR" "$SIMULATOR_OS")
          xcodebuild build-for-testing -quiet \
            -workspace Example/WaypointExample.xcworkspace \
            -scheme WaypointExample \
            -destination "id=$udid" \
            -derivedDataPath .build/example-derived-data \
            -testProductsPath "$PRODUCTS" \
            -skipMacroValidation \
            COMPILATION_CACHE_ENABLE_CACHING=NO \
            WAYPOINT_TUIST_OFFLINE=1 WAYPOINT_TUIST_TEST_RUN=1

      # A tar keeps the bundle's symbolic links and file modes, which the artifact's zip doesn't.
      - name: Pack the built tests
        run: tar -C .build -cf .build/example-test-products.tar WaypointExample.xctestproducts

      - name: Hand the built tests to the shards
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-test-products
          path: .build/example-test-products.tar
          retention-days: 1
          if-no-files-found: error

      # Every test bundle but the UI tests: the app's own unit tests and each module's.
      - name: Run the example app's unit tests
        run: |
          udid=$(scripts/find-ci-simulator.sh "$SIMULATOR" "$SIMULATOR_OS")
          bundle=.build/results/example-unit.xcresult
          status=0
          xcodebuild test-without-building -quiet \
            -testProductsPath "$PRODUCTS" \
            -destination "id=$udid" \
            -skip-testing:WaypointExampleUITests \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure -test-iterations 2 \
            -resultBundlePath "$bundle" || status=$?
          scripts/judge-test-results.sh "$status" "$bundle"

      - name: Check that Tuist's test hashes see every part
        run: scripts/check-selective-testing-hashes.sh

      - name: Keep the result bundle of a failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-unit-results
          path: .build/results
          retention-days: 7

  ui:
    name: UI tests, shard ${{ matrix.shard }} of 3 (Xcode 27.2)
    needs: example
    if: ${{ !github.event.pull_request.draft && !inputs.docs-only }}
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the built tests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: example-test-products
          path: .build

      - name: Unpack the built tests
        run: tar -C .build -xf .build/example-test-products.tar

      - name: Run this shard's UI tests
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          scripts/ui-test-shards.py 3 --list
          only=()
          while IFS= read -r argument; do
            only+=("$argument")
          done < <(scripts/ui-test-shards.py 3 "$SHARD")
          if [[ ${#only[@]} -eq 0 ]]; then
            echo "This shard has no UI test class."
            exit 0
          fi
          udid=$(scripts/find-ci-simulator.sh "$SIMULATOR" "$SIMULATOR_OS")
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          bundle=.build/results/ui-shard-$SHARD.xcresult
          status=0
          xcodebuild test-without-building -quiet \
            -testProductsPath "$PRODUCTS" \
            -destination "id=$udid" \
            "${only[@]}" \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure -test-iterations 2 \
            -resultBundlePath "$bundle" || status=$?
          scripts/judge-test-results.sh "$status" "$bundle"

      - name: Keep the result bundle of a failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-shard-${{ matrix.shard }}-results
          path: .build/results
          retention-days: 7

  # A system link and a route with no destination in its stack must be reported in release builds
  # too, so their UI tests run again with the app and the tests built in Release. It waits for the
  # package job, so the run holds at most 4 macOS jobs: the package job or this one, the example
  # job, then the 3 shards.
  release-reports:
    name: Release reports (Xcode 27.2)
    needs: package
    if: ${{ !github.event.pull_request.draft && !inputs.docs-only }}
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tuist
        run: scripts/install-tuist.sh "$RUNNER_TEMP/tuist"

      - name: Generate the example app
        run: |
          tuist install --path Example
          tuist generate --path Example --no-open

      - name: Build in Release and run the release report UI tests
        run: |
          udid=$(scripts/find-ci-simulator.sh "$SIMULATOR" "$SIMULATOR_OS")
          bundle=.build/results/release-reports.xcresult
          status=0
          xcodebuild test -quiet \
            -workspace Example/WaypointExample.xcworkspace \
            -scheme WaypointExample \
            -configuration Release \
            -destination "id=$udid" \
            -derivedDataPath .build/release-reports-derived-data \
            -only-testing:WaypointExampleUITests/SystemLinkTests \
            -only-testing:WaypointExampleUITests/MissingDestinationTests \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure -test-iterations 2 \
            -resultBundlePath "$bundle" \
            -skipMacroValidation \
            COMPILATION_CACHE_ENABLE_CACHING=NO \
            WAYPOINT_TUIST_OFFLINE=1 WAYPOINT_TUIST_TEST_RUN=1 || status=$?
          scripts/judge-test-results.sh "$status" "$bundle"

      - name: Keep the result bundle of a failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-reports-results
          path: .build/results
          retention-days: 7

  gate:
    name: Apple builds and tests
    needs: [package, example, ui, release-reports]
    if: ${{ always() && !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      # A docs-only change skips every job on purpose, so it passes.
      - name: Check that every job passed
        env:
          DOCS_ONLY: ${{ inputs.docs-only }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          if [[ "$DOCS_ONLY" == "true" ]]; then
            echo "Docs-only change: no build reads these files, so the checks were skipped."
            exit 0
          fi
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [[ "$result" != "success" ]]; then
              echo "::error::An Apple check didn't pass: $RESULTS."
              exit 1
            fi
          done

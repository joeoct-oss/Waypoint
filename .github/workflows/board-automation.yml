# Moves pull requests on the Waypoint project board.
# A draft PR goes to "In progress", and a PR ready for review to "In review".
# Issues live in the planning repo, whose own copy of this workflow moves an
# assigned issue to "Tests first".
# Switched off unless the repository variable BOARD_AUTOMATION is "true".
# Skips pull requests Dependabot opened: its runs get no repository secrets, and its
# updates need no card.
# Needs the WAYPOINT_PROJECT_TOKEN secret: a classic token with the
# project and repo scopes, because GITHUB_TOKEN cannot write to a
# project owned by a personal account.
name: Move pull requests on the project board

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions: {}

env:
  PROJECT_ID: PVT_kwHOAyL-xM4Br2PN
  STATUS_FIELD_ID: PVTSSF_lAHOAyL-xM4Br2PNzhqG_sI
  STATUS_IN_PROGRESS: 023a83b6
  STATUS_IN_REVIEW: 37348c6d

jobs:
  move-item:
    name: Move the pull request to its column
    if: vars.BOARD_AUTOMATION == 'true' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # GraphQL directly: actions/add-to-project makes a draft card instead when the PR's owner
      # (the org) isn't the board's owner (the user), and `gh project` asks for extra token scopes.
      - name: Add the pull request to the board and set its column
        env:
          GH_TOKEN: ${{ secrets.WAYPOINT_PROJECT_TOKEN }}
          CONTENT_ID: ${{ github.event.pull_request.node_id }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        # The GraphQL variables ($project and the rest) are meant for GitHub, not the shell.
        run: |
          if [ "$IS_DRAFT" = "true" ]; then
            status_option="$STATUS_IN_PROGRESS"
          else
            status_option="$STATUS_IN_REVIEW"
          fi
          # shellcheck disable=SC2016
          item_id="$(gh api graphql \
            -f query='mutation($project: ID!, $content: ID!) {
              addProjectV2ItemById(input: {projectId: $project, contentId: $content}) { item { id } }
            }' \
            -f project="$PROJECT_ID" -f content="$CONTENT_ID" \
            --jq '.data.addProjectV2ItemById.item.id')"
          # shellcheck disable=SC2016
          gh api graphql \
            -f query='mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
              updateProjectV2ItemFieldValue(input: {projectId: $project, itemId: $item,
                fieldId: $field, value: {singleSelectOptionId: $option}}) { projectV2Item { id } }
            }' \
            -f project="$PROJECT_ID" -f item="$item_id" -f field="$STATUS_FIELD_ID" \
            -f option="$status_option" > /dev/null
          echo "Moved item $item_id"

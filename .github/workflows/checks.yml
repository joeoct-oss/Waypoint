# Runs every check on a pull request to main and on a push to main, in stages: every later stage
# waits for the fast checks, and the Apple tests wait for every stage 2 check, so a failure stops
# the run before it spends Linux or macOS time.
# 1. "Fast checks", seconds long: actionlint, zizmor, the script checks of scripts/test-linux.sh
#    (--checks-only; it gets PRIVATE_NAMES for the public text check), the coordinator size limit,
#    lint (swift-format and SwiftLint, through scripts/lint.sh), dependency review when the
#    package's dependencies changed, and which kinds of files changed.
# 2. Once the fast checks passed, side by side:
#    - "SonarQube Cloud quality gate": scripts/sonar-scan.sh analyzes the code and waits for the
#      gate. Until that script is on main, the job passes without analyzing anything.
#    - The Linux checks (ci.yml): build and tests with warnings as errors, the compile fixtures,
#      the thread sanitizer, the lowest Swift, and the coverage of WaypointCore, which the Codecov
#      job below uploads once SonarQube passed. On pull requests and on main.
#    - "Apple build", pull requests only: the package for the macOS host and an iOS device with
#      warnings as errors, the docs, and the example app with every test bundle, whose products it
#      keeps for the Apple tests. One macOS runner, so a change that doesn't build on Apple's
#      toolchain fails here without spending test time.
# 3. The Apple tests (apple.yml), pull requests only, once every stage 2 check passed and the
#    head commit is approved (by CodeRabbit or a person) or carries the run-apple-checks label,
#    whichever comes last (scripts/apple-tests-ready.sh). When the approval comes after those
#    checks, apple-tests.yml starts them instead. Both report as "Apple platform checks / Apple
#    builds and tests". A push cancels the Apple tests still going for the pull request.
# - A docs-only pull request (TESTING.md's rule, scripts/docs-only.sh: every changed file is a
#   Markdown file, a DocC catalog file or a docs-theme file, or the only one is
#   Example/quarantine.json) runs stage 1 and SonarQube and skips the builds and tests: the Linux
#   and Apple gates still report a pass, so it can merge.
# - CodeRabbit reviews beside this workflow as an app, and Gitar too, on a trial and advice only.
#   The branch name check and the board automation stay in workflows of their own.
# - Drafts are skipped until they are ready for review. A newer push cancels the run still going
#   for the same PR. Runs on main are never cancelled.
# Hardening: free GitHub-hosted runners only (standard Linux, and standard macOS for the Apple
# checks), never a larger or self-hosted runner. Actions are pinned to a full commit SHA with the
# version in a comment, images to a digest. No checkout keeps the token, and each job gets only
# the permissions it uses. Pull requests from forks get no secrets, so the SonarQube and Codecov
# steps skip there.
name: Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast:
    name: Fast checks
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      docs-only: ${{ steps.changes.outputs.docs-only }}
    steps:
      # The full history: the base commit lists the changed files, and the script checks copy
      # the repository with git.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Checks workflow syntax, expressions and, through the runner's shellcheck, every run script.
      # The download follows HTTPS only and is checked against its checksum.
      - name: actionlint
        env:
          VERSION: 1.7.9
          SHA256: 233b280d05e100837f4af1433c7b40a5dcb306e3aa68fb4f17f8a7f45a7df7b4
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v$VERSION/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "$SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      # Checks for security mistakes: unpinned actions and images, broad permissions, script
      # injection, kept credentials and cache poisoning. Offline, so it needs no token.
      - name: zizmor
        if: ${{ !cancelled() }}
        env:
          VERSION: 1.33.1
          SHA256: 49eb92a95347e7da58c3123e4d5b297dbb6fe8ecc328e9db68df14c08e25e151
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          echo "zizmor==$VERSION --hash=sha256:$SHA256" > "$RUNNER_TEMP/zizmor.txt"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --no-deps --require-hashes \
            -r "$RUNNER_TEMP/zizmor.txt"
          "$RUNNER_TEMP/zizmor/bin/zizmor" --offline --format=github .github/workflows

      # The checks before the Swift build in scripts/test-linux.sh: they need bash, git, perl,
      # python3 and procps, which the runner has, so nothing is installed. PRIVATE_NAMES is a repo
      # secret, so the list of names the public text check refuses is never in the repository or
      # the public run log; a fork's pull request gets it empty, and the check skips that part. This
      # step and the ones around it run even when one of them failed, so each failure is reported.
      - name: Script checks
        if: ${{ !cancelled() }}
        env:
          PRIVATE_NAMES: ${{ secrets.PRIVATE_NAMES }}
        run: scripts/test-linux.sh --checks-only

      # The example app's coordinator files stay under 500 lines (CODE_STYLE.md).
      - name: Size limits
        if: ${{ !cancelled() }}
        run: scripts/check-coordinator-size.sh

      # CODE_STYLE.md, checked by swift-format and SwiftLint (scripts/lint.sh), as in the cloud
      # while working. swift-format runs in the Swift image the Linux checks pin, whose
      # `swift format` is the version .mise.toml expects. SwiftLint runs on the runner host, at
      # the version scripts/bootstrap.sh installs from .mise.toml with its sha256 checked: the
      # Linux SwiftLint needs libxml2.so.2, which the image doesn't ship, and reads the syntax
      # its custom rules need through the host toolchain's SourceKit.
      - name: Lint
        if: ${{ !cancelled() }}
        env:
          IMAGE: swift:6.4.3@sha256:e0f67c4120502628d4ced5058df25d334332e21501ae1a0797fd0c0a96486e79
        run: |
          docker run --rm --volume "$PWD:/package" --workdir /package "$IMAGE" \
            scripts/lint.sh --swift-format-only
          scripts/bootstrap.sh
          scripts/lint.sh --swiftlint-only

      # Docs-only: every file the pull request changes matches TESTING.md's docs-only rule. A
      # rename counts as a deletion and an addition, so a source file moved to Markdown isn't
      # docs-only. A push to main is never docs-only.
      - name: Which files changed
        id: changes
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          docs_only=false
          if [[ -n "$BASE" ]]; then
            changed=$(git diff --no-renames --name-only "$BASE" HEAD)
            echo "Changed files:"
            echo "$changed"
            docs_only=$(scripts/docs-only.sh <<<"$changed")
          fi
          echo "Docs-only: $docs_only"
          echo "docs-only=$docs_only" >> "$GITHUB_OUTPUT"

      # Fails a pull request that adds or bumps a dependency with a known vulnerability of moderate
      # severity or higher, from GitHub's advisory database. Only when a package manifest or its
      # pins changed, since nothing else adds a dependency.
      - name: Did the dependencies change
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        id: deps
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE" HEAD -- Package.swift Package.resolved Example/Tuist/Package.swift \
            Example/Tuist/Package.resolved; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Review the changed dependencies
        if: ${{ !cancelled() && steps.deps.outputs.changed == 'true' }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  sonar:
    name: SonarQube Cloud quality gate
    needs: fast
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # The full history gives Sonar the blame data it needs to tell new code from old.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Is the scan set up
        id: setup
        env:
          FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          if [[ ! -f scripts/sonar-scan.sh ]]; then
            echo "scripts/sonar-scan.sh isn't on this branch yet, so there is nothing to analyze."
            echo "scan=false" >> "$GITHUB_OUTPUT"
          elif [[ "$FORK" == "true" ]]; then
            echo "A pull request from a fork gets no SONAR_TOKEN, so it isn't analyzed."
            echo "scan=false" >> "$GITHUB_OUTPUT"
          else
            echo "scan=true" >> "$GITHUB_OUTPUT"
          fi

      # The scanner jar, checked against its checksum before use, so most runs download nothing.
      # Pull requests only, as with every cache here.
      - name: Restore the scanner
        if: ${{ steps.setup.outputs.scan == 'true' && github.event_name == 'pull_request' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sonar-scanner
          key: sonar-scanner-${{ hashFiles('scripts/sonar-scan.sh') }}

      - name: Analyze and wait for the quality gate
        if: ${{ steps.setup.outputs.scan == 'true' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: scripts/sonar-scan.sh

  linux:
    name: Linux checks
    needs: fast
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    with:
      docs-only: ${{ needs.fast.outputs.docs-only == 'true' }}

  # Uploads the coverage of WaypointCore the Linux checks measured, once SonarQube passed, so a
  # draft or a run stopped early starts no upload. Codecov only reports the numbers, so this never
  # fails a run.
  codecov:
    name: Coverage to Codecov
    needs: [fast, sonar, linux]
    if: >-
      ${{ !cancelled() && needs.sonar.result == 'success' && needs.fast.outputs.docs-only != 'true'
      && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the report
        id: report
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage

      - name: Upload to Codecov
        if: ${{ steps.report.outcome == 'success' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.lcov
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false

  # Builds everything the Apple tests run, beside the Linux checks, and keeps the example app's test
  # products for them (scripts/build-example-tests.sh). Not a required check itself: when it fails,
  # the Apple tests never start, so the required Apple gate reports nothing and holds the merge.
  apple-build:
    name: Apple build
    needs: fast
    if: ${{ github.event_name == 'pull_request' && needs.fast.outputs.docs-only != 'true' }}
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      WAYPOINT_TUIST_OFFLINE: "1"
      TUIST_DISABLE_ANALYTICS: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show the tools
        run: |
          xcodebuild -version
          swift --version
          sysctl -n hw.ncpu hw.memsize machdep.cpu.brand_string

      - name: Build the tests on the macOS host, with warnings as errors
        run: swift build --build-tests --force-resolved-versions -Xswiftc -warnings-as-errors

      # Build only: the runners have no iOS 17 simulator.
      - name: Build for an iOS device, with warnings as errors in Waypoint's own code
        run: |
          scripts/own-warnings-as-errors.sh scripts/package-xcodebuild.sh build -quiet \
            -scheme Waypoint-Package \
            -destination generic/platform=iOS \
            CODE_SIGNING_ALLOWED=NO

      # Build only: the docs site is deployed from the Mac.
      - name: Build the docs
        run: scripts/build-docs.sh

      - name: Install Tuist
        run: scripts/install-tuist.sh "$RUNNER_TEMP/tuist"

      - name: Build the example app and its tests
        run: scripts/build-example-tests.sh "iPhone 17" "27.2"

      - name: Check that Tuist's test hashes see every part
        run: scripts/check-selective-testing-hashes.sh

      # Kept 30 days, so an approval that comes days later still finds them.
      - name: Keep the built tests for the Apple tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-test-products-${{ github.sha }}
          path: .build/example-test-products.tar
          retention-days: 30
          if-no-files-found: error

  # Are the Apple tests due: SonarQube, the Linux checks and the Apple build passed, so only the
  # approval or the label is left.
  ready:
    name: Are the Apple tests due
    needs: [fast, sonar, linux, apple-build]
    if: ${{ github.event_name == 'pull_request' && needs.fast.outputs.docs-only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      pull-requests: read
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Is the head commit approved or labelled
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/apple-tests-ready.sh "$REPO" "$NUMBER" "$HEAD_SHA"

  # A push makes the Apple tests of the commits before it pointless, including runs apple-tests.yml
  # started, so this cancels them. Their concurrency groups are per commit, so a late decision for an
  # older commit can never cancel the current commit's tests. It runs no code from the pull request.
  stop-old-apple-tests:
    name: Stop the Apple tests of an older commit
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Stop them
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A late run for a push that is no longer the head stops nothing, so it can't cancel the
          # tests of the commit after it.
          current=$(gh api "repos/$REPO/commits/refs/pull/$NUMBER/head" --jq '.sha')
          if [[ "$current" != "$HEAD_SHA" ]]; then
            echo "$HEAD_SHA is no longer the head ($current is), so this stops nothing."
            exit 0
          fi
          for status in queued in_progress waiting pending; do
            gh api --paginate -X GET "repos/$REPO/actions/workflows/apple-tests.yml/runs" -f status="$status" \
              --jq ".workflow_runs[] | select(.head_sha != \"$HEAD_SHA\")
                | select(any(.pull_requests[]?; .number == $NUMBER)) | .id"
          done | sort -u | while read -r run; do
            echo "Cancelling run $run, which tests a commit before $HEAD_SHA."
            gh api -X POST "repos/$REPO/actions/runs/$run/cancel" >/dev/null || true
          done

  # A docs-only pull request goes straight through, so the gate reports a pass.
  apple:
    name: Apple platform checks
    needs: [fast, ready]
    if: >-
      ${{ !cancelled() && github.event_name == 'pull_request' && needs.fast.result == 'success'
      && (needs.fast.outputs.docs-only == 'true' || needs.ready.outputs.ready == 'true') }}
    concurrency:
      group: apple-tests-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
      cancel-in-progress: true
    permissions:
      contents: read
      actions: read
      checks: read
      id-token: write
    uses: ./.github/workflows/apple.yml # zizmor: ignore[self-repository]
    with:
      docs-only: ${{ needs.fast.outputs.docs-only == 'true' }}

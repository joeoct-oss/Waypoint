# Runs the Linux checks (scripts/test-linux.sh) on pull requests to main, in two parts: the script
# checks, which need no Swift, on the runner host in the first job, and the Swift part in the
# swift:6.4 container.
# Every job runs on Tuist runners (`tuist-linux`, planning #433), not GitHub-hosted runners, so CI uses the
# Tuist account's Linux minutes instead of GitHub Actions minutes. Built to use few of them:
# - draft pull requests are skipped; the check runs when a PR is ready for review and on every push after that,
# - a pull request that changes only docs (TESTING.md's docs only rule: *.md, *.docc/**, docs-theme/**)
#   skips both Swift jobs, which GitHub counts as passed; the first job, "Changed files and docs
#   checks" (a required check too), still runs the two checks that read docs. On any other pull
#   request it runs every script check, once. If that job fails, the Swift jobs run anyway,
# - a newer push cancels the run still going for the same PR,
# - the SwiftPM build folder is cached between runs, keyed by Package.swift and Package.resolved
#   only, so a pull request saves it once and later pushes restore it without saving again,
# - the script checks run on the runner host, which has bash, git, perl, python3 and procps, so
#   the Swift container installs nothing.
# A second job builds the package with Swift 6.2, the minimum Package.swift declares (build only, no tests).
# The Mac stays the full test gate (scripts/test-mac.sh, see TESTING.md); there is no macOS job here.
# Switched off unless the repository variable CI_ENABLED is "true".
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed files and docs checks
    if: vars.CI_ENABLED == 'true' && !github.event.pull_request.draft
    runs-on: tuist-linux
    timeout-minutes: 10
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # "code" is false only when every changed file is docs only. Renames list both names, so a
      # Swift file renamed to a .md file still counts as code. A run started by hand has no pull
      # request to compare with, so it runs everything.
      - name: List the changed files
        id: files
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          code=true
          if [ -n "$BASE" ]; then
            changed=$(git diff --name-only --no-renames "$BASE...$HEAD")
            printf '%s\n' "$changed"
            if [ -z "$(printf '%s\n' "$changed" | grep -Ev '\.md$|\.docc/|^docs-theme/|^$')" ]; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Swift jobs run: $code"

      # The script checks need no Swift, so they run here, each once. A docs only pull request
      # runs only the two that read Markdown; any other runs all of them.
      - name: Check comment line width and one import in docs
        if: steps.files.outputs.code == 'false'
        run: |
          scripts/check-comment-width.sh
          scripts/check-single-import.sh

      - name: Run the Linux script checks
        if: steps.files.outputs.code == 'true'
        run: scripts/test-linux.sh --checks-only

  linux:
    name: Linux checks
    needs: changes
    # Runs unless the first job passed and found docs only, so a failed or cancelled first job
    # never lets the Swift jobs skip.
    if: >-
      !cancelled() && vars.CI_ENABLED == 'true' && !github.event.pull_request.draft &&
      !(needs.changes.result == 'success' && needs.changes.outputs.code == 'false')
    runs-on: tuist-linux
    timeout-minutes: 20
    container:
      image: swift:6.4
      # The thread sanitizer turns off address randomization for itself, which Docker's default
      # seccomp profile forbids; without this it stops with "incompatible memory layout".
      options: --security-opt seccomp=unconfined
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore the build cache
        uses: actions/cache@v4
        with:
          path: .build
          key: linux-swift-6.4-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            linux-swift-6.4-

      # The first job ran the script checks, so this runs only the Swift part.
      - name: Run the Linux Swift checks
        run: scripts/test-linux.sh --swift-only

  minimum-swift:
    name: Builds with Swift 6.2
    needs: changes
    # Runs unless the first job passed and found docs only, so a failed or cancelled first job
    # never lets the Swift jobs skip.
    if: >-
      !cancelled() && vars.CI_ENABLED == 'true' && !github.event.pull_request.draft &&
      !(needs.changes.result == 'success' && needs.changes.outputs.code == 'false')
    runs-on: tuist-linux
    timeout-minutes: 15
    container: swift:6.2
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Restore the build cache
        uses: actions/cache@v4
        with:
          path: .build
          key: linux-swift-6.2-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            linux-swift-6.2-

      - name: swift build
        run: swift build

# Builds and tests the package on Linux, where WaypointCore builds and tests and the renderer
# targets compile empty (TESTING.md, "Where each test runs").
# - The checks workflow (checks.yml) calls it on pull requests to main and on pushes to main, once
#   its fast checks and SonarQube Cloud's quality gate passed; drafts are skipped until they are
#   ready for review. A docs-only pull request (docs-only input) skips every job, and the gate
#   reports a pass.
# - "Linux build and tests" is the one required check: it passes only when every job below passed.
# - Swift 6.4: one build with warnings as errors, which the compile fixtures and the tests reuse.
#   Then, in steps that never fail the job, the tests run again with coverage on, and the lines of
#   Sources/WaypointCore they ran are kept as the "coverage" artifact (coverage.lcov), which the
#   checks workflow uploads to Codecov. A coverage problem never blocks a pull request.
# - The thread sanitizer runs in its own job beside it, since it rebuilds everything.
# - Swift 6.2, the tools version in Package.swift: every test, warnings as errors.
# - The script checks run in the checks workflow's fast checks, before this one. A run by hand of
#   scripts/test-linux.sh runs the build, fixtures, tests and thread sanitizer with the Swift
#   installed, without coverage; to reproduce the Swift 6.2 job, run `swift test
#   --force-resolved-versions -Xswiftc -warnings-as-errors` in the swift:6.2 image this job pins.
# Hardening: free GitHub-hosted Linux runners only. Every action is pinned to a full commit SHA and
# every image to a digest, with the version in a comment; Dependabot bumps the actions, and the
# images are bumped by hand. Each job reads the repo and nothing else, and no checkout keeps the
# token. The build cache is used on pull requests only, so nothing a cache holds reaches main.
name: Linux checks

on:
  workflow_call:
    inputs:
      docs-only:
        description: The change touches only docs no build reads, so every job is skipped
        type: boolean
        default: false
  workflow_dispatch:

permissions: {}

jobs:
  tests:
    name: Build and tests (Swift 6.4)
    if: ${{ !github.event.pull_request.draft && !inputs.docs-only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    container:
      image: swift:6.4.3@sha256:e0f67c4120502628d4ced5058df25d334332e21501ae1a0797fd0c0a96486e79
    env:
      SWIFT_FLAGS: -Xswiftc -warnings-as-errors
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore the build cache
        if: github.event_name == 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: swift-6.4.3-${{ hashFiles('Package.swift', 'Package.resolved') }}

      # SWIFT_FLAGS is split into words on purpose: each flag is its own argument.
      - name: Build the tests, with warnings as errors
        run: |
          # shellcheck disable=SC2086
          swift build --build-tests --force-resolved-versions $SWIFT_FLAGS

      - name: Check the compile fixtures
        run: WAYPOINT_SWIFT_BUILD_FLAGS="--force-resolved-versions $SWIFT_FLAGS" scripts/check-compile-failures.sh

      - name: Test, with warnings as errors
        run: |
          # shellcheck disable=SC2086
          swift test --force-resolved-versions $SWIFT_FLAGS

      # Only feeds the Codecov report, so a failed run, export or upload never fails the job.
      - name: Measure the coverage of WaypointCore
        id: coverage
        continue-on-error: true
        run: |
          # shellcheck disable=SC2086
          swift test --force-resolved-versions $SWIFT_FLAGS --enable-code-coverage
          # shellcheck disable=SC2086
          scripts/core-coverage.sh coverage.lcov $SWIFT_FLAGS --enable-code-coverage

      - name: Keep the coverage report
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.lcov
          retention-days: 1

  tsan:
    name: Thread sanitizer (Swift 6.4)
    if: ${{ !github.event.pull_request.draft && !inputs.docs-only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    # The thread sanitizer turns off address randomisation with `personality`, which Docker's
    # default seccomp profile blocks, so the container runs without it.
    container:
      image: swift:6.4.3@sha256:e0f67c4120502628d4ced5058df25d334332e21501ae1a0797fd0c0a96486e79
      options: --security-opt seccomp=unconfined
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Its own key: a sanitizer build shares nothing with the other jobs' builds.
      - name: Restore the build cache
        if: github.event_name == 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: swift-6.4.3-tsan-${{ hashFiles('Package.swift', 'Package.resolved') }}

      - name: Test with the thread sanitizer
        run: swift test --force-resolved-versions --sanitize=thread

  lowest:
    name: Tests on Swift 6.2
    if: ${{ !github.event.pull_request.draft && !inputs.docs-only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    container:
      image: swift:6.2.4@sha256:576698469fd3cf95b2abdeb91a7571d3afcd91806c87283dd01d564803554c0f
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore the build cache
        if: github.event_name == 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: swift-6.2.4-${{ hashFiles('Package.swift', 'Package.resolved') }}

      - name: Test, with warnings as errors
        run: swift test --force-resolved-versions -Xswiftc -warnings-as-errors

  # Skipped, not failed, when a newer push cancels the run, since that push's run replaces it.
  gate:
    name: Linux build and tests
    needs: [tests, tsan, lowest]
    if: ${{ !cancelled() && !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      # A docs-only change skips every job on purpose, so it passes.
      - name: Check that every job passed
        env:
          DOCS_ONLY: ${{ inputs.docs-only }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          if [[ "$DOCS_ONLY" == "true" ]]; then
            echo "Docs-only change: no build reads these files, so the tests were skipped."
            exit 0
          fi
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [[ "$result" != "success" ]]; then
              echo "::error::A Linux check didn't pass: $RESULTS."
              exit 1
            fi
          done

# Runs the Linux checks (scripts/test-linux.sh) on pull requests to main.
# Every job runs on Tuist runners (`tuist-linux`, planning #433), not GitHub-hosted runners, so CI uses the
# Tuist account's Linux minutes instead of GitHub Actions minutes. Built to use few of them:
# - draft pull requests are skipped; the check runs when a PR is ready for review and on every push after that,
# - a pull request that changes only docs (TESTING.md's docs only rule: *.md, *.docc/**, docs-theme/**)
#   skips both Swift jobs, which GitHub counts as passed; the first job, "Changed files and docs
#   checks" (a required check too), still runs the two checks that read docs. If that job fails,
#   the Swift jobs run anyway,
# - a newer push cancels the run still going for the same PR,
# - the SwiftPM build folder is cached between runs.
# A second job builds the package with Swift 6.2, the minimum Package.swift declares (build only, no tests).
# The Mac stays the full test gate (scripts/test-mac.sh, see TESTING.md); there is no macOS job here.
# Switched off unless the repository variable CI_ENABLED is "true".
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed files and docs checks
    if: vars.CI_ENABLED == 'true' && !github.event.pull_request.draft
    runs-on: tuist-linux
    timeout-minutes: 5
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # "code" is false only when every changed file is docs only. Renames list both names, so a
      # Swift file renamed to a .md file still counts as code. A run started by hand has no pull
      # request to compare with, so it runs everything.
      - name: List the changed files
        id: files
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          code=true
          if [ -n "$BASE" ]; then
            changed=$(git diff --name-only --no-renames "$BASE...$HEAD")
            printf '%s\n' "$changed"
            if [ -z "$(printf '%s\n' "$changed" | grep -Ev '\.md$|\.docc/|^docs-theme/|^$')" ]; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Swift jobs run: $code"

      # The two Linux checks that read Markdown need no Swift, so they run here on every pull
      # request, docs only included. scripts/test-linux.sh runs them again with the rest.
      - name: Check comment line width
        run: scripts/check-comment-width.sh

      - name: Check that app code and docs snippets import Waypoint once
        run: scripts/check-single-import.sh

  linux:
    name: Linux checks
    needs: changes
    # Runs unless the first job passed and found docs only, so a failed or cancelled first job
    # never lets the Swift jobs skip.
    if: >-
      !cancelled() && vars.CI_ENABLED == 'true' && !github.event.pull_request.draft &&
      !(needs.changes.result == 'success' && needs.changes.outputs.code == 'false')
    runs-on: tuist-linux
    timeout-minutes: 20
    container:
      image: swift:6.4
      # The thread sanitizer turns off address randomization for itself, which Docker's default
      # seccomp profile forbids; without this it stops with "incompatible memory layout".
      # --init runs a small init process as PID 1, which reaps the processes the run lock check
      # stops; without it they stay as zombies and that check waits on them.
      options: --security-opt seccomp=unconfined --init
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the tools the check scripts use
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          missing=""
          command -v pgrep >/dev/null && command -v pkill >/dev/null && command -v ps >/dev/null \
            || missing="$missing procps"
          [ -x /usr/bin/python3 ] || missing="$missing python3"
          command -v perl >/dev/null || missing="$missing perl"
          if [ -n "$missing" ]; then
            apt-get update -qq
            apt-get install -y -qq $missing
          fi

      - name: Restore the build cache
        uses: actions/cache@v4
        with:
          path: .build
          key: linux-swift-6.4-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            linux-swift-6.4-${{ hashFiles('Package.swift', 'Package.resolved') }}-

      - name: Run the Linux checks
        run: scripts/test-linux.sh

  minimum-swift:
    name: Builds with Swift 6.2
    needs: changes
    # Runs unless the first job passed and found docs only, so a failed or cancelled first job
    # never lets the Swift jobs skip.
    if: >-
      !cancelled() && vars.CI_ENABLED == 'true' && !github.event.pull_request.draft &&
      !(needs.changes.result == 'success' && needs.changes.outputs.code == 'false')
    runs-on: tuist-linux
    timeout-minutes: 15
    container: swift:6.2
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Restore the build cache
        uses: actions/cache@v4
        with:
          path: .build
          key: linux-swift-6.2-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            linux-swift-6.2-${{ hashFiles('Package.swift', 'Package.resolved') }}-

      - name: swift build
        run: swift build

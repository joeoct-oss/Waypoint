# Settings for SonarQube Cloud's analysis, run by scripts/sonar-scan.sh from the checks workflow
# on every pull request and push to main, beside the Linux checks once the fast checks passed
# (TESTING.md, "On pull requests (CI)"); its quality gate is a required check. The rules are the org's "Sonar way comprehensive": bugs, security and code quality.
# - Sources and tests are kept apart, so the rules check the package's and the example app's
#   code, and the tests are judged by their own rules and by review (CODE_STYLE.md, TESTING.md).
# - Coverage lives in Codecov. Sonar gets no coverage report, so no file counts toward Sonar's
#   coverage and it never reports 0%.
# - The project's "automatic analysis" setting stays off in Sonar: the CI scan replaces it, and
#   when on it would replace these paths with its own.
sonar.organization=joeoct-oss
sonar.projectKey=joeoct-oss_Waypoint
# The example app (Orbit Shop) is code a reader copies, so it is checked like the package. The
# docs site's own scripts are checked too; the vendored libraries under docs-theme/vendor are
# third-party code copied as released, so their issues aren't ours to fix.
sonar.sources=Sources,Package.swift,scripts,.github,Example/WaypointExample,Example/Project.swift,Example/Tuist.swift,Example/Tuist/Package.swift,docs-theme
sonar.exclusions=docs-theme/vendor/**
sonar.tests=Tests,Example/ModuleTests,Example/WaypointExampleTests,Example/WaypointExampleUITests
sonar.sourceEncoding=UTF-8
sonar.coverage.exclusions=**/*
sonar.python.version=3
